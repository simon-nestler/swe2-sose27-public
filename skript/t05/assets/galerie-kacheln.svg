<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Zwei Kacheln einer Medien-App: Foto mit Vorschaubild, Video mit Play-Symbol</title>
  <desc id="d">Links eine Kachel mit einem Foto-Vorschaubild aus Sonne und Bergsilhouette, beschriftet mit Foto und der Fähigkeit anzeigen. Rechts eine Kachel mit dunklem Vorschaubild und gelbem Play-Knopf, beschriftet mit Video und den Fähigkeiten anzeigen und abspielen.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 30px; font-weight: 700; }
    .cap { font-size: 22px; fill: #5a6472; }
    .tile { fill: #ffffff; stroke: #c7cdd4; stroke-width: 2; }
    .thumb { fill: #eef1f5; }
    .thumb-dark { fill: #1a2f6e; }
    .motiv { fill: none; stroke: #1a2f6e; stroke-width: 4; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Kachel Foto -->
  <g>
    <rect class="tile" x="130" y="70" width="420" height="380" rx="14"/>
    <rect class="thumb" x="150" y="90" width="380" height="240" rx="8"/>
    <circle cx="250" cy="160" r="28" fill="none" stroke="#1a2f6e" stroke-width="4"/>
    <polyline class="motiv" points="170,310 300,200 380,270 440,220 510,300"/>
    <text class="h" x="150" y="385">Foto</text>
    <text class="cap" x="150" y="420">anzeigen</text>
  </g>

  <!-- Kachel Video -->
  <g>
    <rect class="tile" x="650" y="70" width="420" height="380" rx="14"/>
    <rect class="thumb-dark" x="670" y="90" width="380" height="240" rx="8"/>
    <circle cx="860" cy="210" r="52" fill="#fcd430"/>
    <path d="M 845 182 L 845 238 L 892 210 Z" fill="#031121"/>
    <text class="h" x="670" y="385">Video</text>
    <text class="cap" x="670" y="420">anzeigen · abspielen</text>
  </g>

  <text class="cap" x="130" y="520">Beide anzeigbar · nur eines abspielbar</text>
</svg>
