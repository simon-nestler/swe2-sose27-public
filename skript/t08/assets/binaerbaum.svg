<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 620" role="img" aria-labelledby="bb-t bb-d">
  <title id="bb-t">Binärer Suchbaum aus der Eingabe 7, 3, 9, 1, 4</title>
  <desc id="bb-d">Ein Baum aus fünf Knoten. Wurzel 7, links darunter 3, rechts darunter 9. Unter der 3 links die 1 und rechts die 4. Leere Kindplätze sind als kleine gestrichelte Kästen mit der Beschriftung null gezeichnet. Unten steht die Regel: links alles Kleinere, rechts alles Größere oder Gleiche.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .bb-n { font-size: 30px; font-weight: 700; text-anchor: middle; }
    .bb-l { font-size: 20px; }
    .bb-s { font-size: 17px; fill: #5a6472; text-anchor: middle; }
    .bb-k { fill: #e5effb; stroke: #1a2f6e; stroke-width: 3; }
    .bb-null { fill: none; stroke: #9aa1aa; stroke-width: 2; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="bb-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2f6e"/></marker>
  </defs>
  <rect width="1260" height="620" fill="#ffffff"/>

  <text class="bb-l" x="80" y="70" style="font-weight:700">Eingabe: 7, 3, 9, 1, 4 – in dieser Reihenfolge</text>

  <!-- Kanten -->
  <line x1="600" y1="176" x2="452" y2="266" stroke="#1a2f6e" stroke-width="3" marker-end="url(#bb-pf)"/>
  <line x1="660" y1="176" x2="808" y2="266" stroke="#1a2f6e" stroke-width="3" marker-end="url(#bb-pf)"/>
  <line x1="402" y1="326" x2="316" y2="416" stroke="#1a2f6e" stroke-width="3" marker-end="url(#bb-pf)"/>
  <line x1="458" y1="326" x2="544" y2="416" stroke="#1a2f6e" stroke-width="3" marker-end="url(#bb-pf)"/>

  <!-- Kanten zu leeren Plätzen -->
  <line x1="800" y1="330" x2="756" y2="420" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="860" y1="330" x2="904" y2="420" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="286" y1="476" x2="246" y2="540" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="334" y1="476" x2="374" y2="540" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="516" y1="476" x2="476" y2="540" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="564" y1="476" x2="604" y2="540" stroke="#9aa1aa" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Knoten -->
  <circle class="bb-k" cx="630" cy="140" r="42"/><text class="bb-n" x="630" y="151">7</text>
  <circle class="bb-k" cx="430" cy="300" r="38"/><text class="bb-n" x="430" y="311">3</text>
  <circle class="bb-k" cx="830" cy="300" r="38"/><text class="bb-n" x="830" y="311">9</text>
  <circle class="bb-k" cx="310" cy="450" r="34"/><text class="bb-n" x="310" y="461">1</text>
  <circle class="bb-k" cx="540" cy="450" r="34"/><text class="bb-n" x="540" y="461">4</text>

  <!-- Leere Kindplätze -->
  <rect class="bb-null" x="726" y="424" width="60" height="38" rx="6"/><text class="bb-s" x="756" y="449">null</text>
  <rect class="bb-null" x="874" y="424" width="60" height="38" rx="6"/><text class="bb-s" x="904" y="449">null</text>
  <rect class="bb-null" x="216" y="544" width="60" height="38" rx="6"/><text class="bb-s" x="246" y="569">null</text>
  <rect class="bb-null" x="344" y="544" width="60" height="38" rx="6"/><text class="bb-s" x="374" y="569">null</text>
  <rect class="bb-null" x="446" y="544" width="60" height="38" rx="6"/><text class="bb-s" x="476" y="569">null</text>
  <rect class="bb-null" x="574" y="544" width="60" height="38" rx="6"/><text class="bb-s" x="604" y="569">null</text>

  <text class="bb-l" x="960" y="140">Die Regel ist hart:</text>
  <text class="bb-l" x="960" y="172">links alles Kleinere,</text>
  <text class="bb-l" x="960" y="204">rechts alles Größere</text>
  <text class="bb-l" x="960" y="236">oder Gleiche.</text>
</svg>
