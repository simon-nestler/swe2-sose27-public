<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="ep-t ep-d">
  <title id="ep-t">Wohin kommt die 6? Der Baum aus 7, 3, 9, 1, 4 mit vier nummerierten Kandidatenplätzen a bis d</title>
  <desc id="ep-d">Der binäre Suchbaum aus der Eingabe 7, 3, 9, 1, 4. Vier gestrichelte Kästen markieren Kandidatenplätze für die 6: a rechts unter der 4, b links unter der 9, c an der Stelle der 4 rechts unter der 3, wobei die 4 eine Ebene nach unten rutschen würde, und d links unter der 7 neben der 3, als drittes Kind. Die Buchstaben stehen in gelben Kreisen.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .ep-n { font-size: 30px; font-weight: 700; text-anchor: middle; }
    .ep-l { font-size: 20px; }
    .ep-s { font-size: 17px; fill: #5a6472; }
    .ep-o { font-size: 22px; font-weight: 700; text-anchor: middle; fill: #031121; }
    .ep-k { fill: #e5effb; stroke: #1a2f6e; stroke-width: 3; }
    .ep-c { fill: none; stroke: #8a5f00; stroke-width: 2.5; stroke-dasharray: 6 5; }
    .ep-mark { fill: #fcd430; stroke: #8a5f00; stroke-width: 2; }
  </style>
  <defs>
    <marker id="ep-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5f00"/></marker>
  </defs>
  <rect width="1260" height="640" fill="#ffffff"/>

  <text class="ep-l" x="80" y="70" style="font-weight:700">Die 6 wird eingefügt. Wo landet sie – und über welche Vergleiche?</text>

  <!-- Kanten -->
  <line x1="600" y1="196" x2="462" y2="276" stroke="#1a2f6e" stroke-width="3"/>
  <line x1="660" y1="196" x2="798" y2="276" stroke="#1a2f6e" stroke-width="3"/>
  <line x1="404" y1="342" x2="332" y2="422" stroke="#1a2f6e" stroke-width="3"/>
  <line x1="456" y1="342" x2="528" y2="422" stroke="#1a2f6e" stroke-width="3"/>

  <!-- Knoten -->
  <circle class="ep-k" cx="630" cy="160" r="42"/><text class="ep-n" x="630" y="171">7</text>
  <circle class="ep-k" cx="430" cy="310" r="38"/><text class="ep-n" x="430" y="321">3</text>
  <circle class="ep-k" cx="830" cy="310" r="38"/><text class="ep-n" x="830" y="321">9</text>
  <circle class="ep-k" cx="310" cy="450" r="34"/><text class="ep-n" x="310" y="461">1</text>
  <circle class="ep-k" cx="540" cy="450" r="34"/><text class="ep-n" x="540" y="461">4</text>

  <!-- (a) rechts unter 4 -->
  <rect class="ep-c" x="600" y="540" width="64" height="48" rx="8"/>
  <line x1="562" y1="478" x2="612" y2="540" stroke="#8a5f00" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle class="ep-mark" cx="694" cy="564" r="17"/><text class="ep-o" x="694" y="572">a</text>

  <!-- (b) links unter 9 -->
  <rect class="ep-c" x="700" y="410" width="64" height="48" rx="8"/>
  <line x1="806" y1="342" x2="748" y2="410" stroke="#8a5f00" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle class="ep-mark" cx="676" cy="434" r="17"/><text class="ep-o" x="676" y="442">b</text>

  <!-- (c) an der Stelle der 4, die 4 rutscht darunter -->
  <rect class="ep-c" x="496" y="408" width="88" height="84" rx="44"/>
  <line x1="540" y1="492" x2="466" y2="556" stroke="#8a5f00" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ep-pf)"/>
  <rect class="ep-c" x="408" y="556" width="64" height="48" rx="8"/>
  <text class="ep-s" x="360" y="626">die 4 rutscht darunter?</text>
  <circle class="ep-mark" cx="588" cy="398" r="17"/><text class="ep-o" x="588" y="406">c</text>

  <!-- (d) links unter 7, neben der 3 -->
  <rect class="ep-c" x="516" y="272" width="64" height="48" rx="8"/>
  <line x1="612" y1="200" x2="558" y2="272" stroke="#8a5f00" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle class="ep-mark" cx="602" cy="256" r="17"/><text class="ep-o" x="602" y="264">d</text>

  <text class="ep-s" x="900" y="440">(a) rechts unter der 4</text>
  <text class="ep-s" x="900" y="472">(b) links unter der 9</text>
  <text class="ep-s" x="900" y="504">(c) rechts unter der 3, die 4 rutscht darunter</text>
  <text class="ep-s" x="900" y="536">(d) links unter der 7, neben der 3</text>
</svg>
