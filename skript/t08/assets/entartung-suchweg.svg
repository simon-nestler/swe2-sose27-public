<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="es-t es-d">
  <title id="es-t">Derselbe Suchauftrag, zwei Datenformen: gesunder Baum mit kurzem Suchweg, Kette mit Suchweg über alle Knoten</title>
  <desc id="es-d">Links ein gleichmäßiger Baum über zehn Ebenen, schematisch mit angedeuteter Fortsetzung; ein goldgelber Suchweg läuft von der Wurzel bis in die unterste Ebene: höchstens 10 Vergleiche bei 1.000 Elementen. Rechts eine Kette aus Knoten, die senkrecht nach unten läuft; der goldgelbe Suchweg führt über jeden einzelnen Knoten und die Kette läuft unten aus dem Bild hinaus: bis zu 1.000 Vergleiche bei denselben 1.000 Elementen.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .es-l { font-size: 21px; font-weight: 700; }
    .es-s { font-size: 18px; fill: #5a6472; }
    .es-g { font-size: 22px; font-weight: 700; fill: #8a5f00; }
    .es-k { fill: #e5effb; stroke: #1a2f6e; stroke-width: 2.5; }
    .es-e { stroke: #c7cdd4; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="es-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5f00"/></marker>
  </defs>
  <rect width="1260" height="640" fill="#ffffff"/>
  <line x1="630" y1="50" x2="630" y2="620" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Links: gesunder Baum -->
  <text class="es-l" x="60" y="70">Gesunder Baum · 1.000 Elemente</text>
  <line class="es-e" x1="330" y1="130" x2="205" y2="210"/><line class="es-e" x1="330" y1="130" x2="455" y2="210"/>
  <line class="es-e" x1="205" y1="210" x2="140" y2="290"/><line class="es-e" x1="205" y1="210" x2="270" y2="290"/>
  <line class="es-e" x1="455" y1="210" x2="390" y2="290"/><line class="es-e" x1="455" y1="210" x2="520" y2="290"/>
  <line x1="140" y1="304" x2="120" y2="430" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="270" y1="304" x2="260" y2="430" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="390" y1="304" x2="390" y2="430" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="520" y1="304" x2="540" y2="430" stroke="#c7cdd4" stroke-width="2" stroke-dasharray="4 6"/>
  <polyline points="330,130 455,210 390,290 400,436" fill="none" stroke="#8a5f00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="es-k" cx="330" cy="130" r="20"/>
  <circle class="es-k" cx="205" cy="210" r="17"/><circle class="es-k" cx="455" cy="210" r="17"/>
  <circle class="es-k" cx="140" cy="290" r="14"/><circle class="es-k" cx="270" cy="290" r="14"/><circle class="es-k" cx="390" cy="290" r="14"/><circle class="es-k" cx="520" cy="290" r="14"/>
  <rect x="90" y="434" width="480" height="40" rx="8" fill="#e5effb" stroke="#c7cdd4" stroke-width="2"/>
  <text class="es-s" x="110" y="461">Ebene 10 · 512 Knoten</text>
  <circle cx="400" cy="454" r="8" fill="#8a5f00"/>
  <text class="es-g" x="60" y="540">höchstens 10 Vergleiche</text>
  <text class="es-s" x="60" y="576">Jeder Vergleich halbiert den Rest.</text>

  <!-- Rechts: die Kette -->
  <text class="es-l" x="700" y="70">Kette · dieselben 1.000 Elemente</text>
  <line x1="940" y1="132" x2="940" y2="176" stroke="#8a5f00" stroke-width="5" marker-end="url(#es-pf)"/>
  <line x1="940" y1="212" x2="940" y2="256" stroke="#8a5f00" stroke-width="5" marker-end="url(#es-pf)"/>
  <line x1="940" y1="292" x2="940" y2="336" stroke="#8a5f00" stroke-width="5" marker-end="url(#es-pf)"/>
  <line x1="940" y1="372" x2="940" y2="416" stroke="#8a5f00" stroke-width="5" marker-end="url(#es-pf)"/>
  <line x1="940" y1="452" x2="940" y2="496" stroke="#8a5f00" stroke-width="5" marker-end="url(#es-pf)"/>
  <line x1="940" y1="532" x2="940" y2="576" stroke="#8a5f00" stroke-width="5" marker-end="url(#es-pf)"/>
  <line x1="940" y1="612" x2="940" y2="638" stroke="#8a5f00" stroke-width="5"/>
  <circle class="es-k" cx="940" cy="110" r="24"/>
  <circle class="es-k" cx="940" cy="190" r="24"/>
  <circle class="es-k" cx="940" cy="270" r="24"/>
  <circle class="es-k" cx="940" cy="350" r="24"/>
  <circle class="es-k" cx="940" cy="430" r="24"/>
  <circle class="es-k" cx="940" cy="510" r="24"/>
  <circle class="es-k" cx="940" cy="590" r="24"/>
  <text class="es-s" x="990" y="480">jeder Knoten trägt einen zweiten,</text>
  <text class="es-s" x="990" y="508">nie benutzten Pfeil</text>
  <text class="es-g" x="700" y="540">bis zu 1.000 Vergleiche</text>
  <text class="es-s" x="700" y="576">Die Kette läuft unten aus dem Bild hinaus.</text>
</svg>
