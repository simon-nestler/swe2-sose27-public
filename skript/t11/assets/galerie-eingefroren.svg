<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Das eingefrorene Galerie-Fenster: Titelzeile „Galerie (Keine Rückmeldung)", Inhalt ausgegraut, Fortschrittsbalken leer, Schaltfläche „Abbrechen" ohne Wirkung, Wartecursor über dem Fenster</title>
  <desc id="d">Nachbau des eingefrorenen App-Fensters aus der Live-Demo. Ein Fenster mit dem Titel „Galerie (Keine Rückmeldung)", darunter ein ausgegrautes Raster aus 28 Vorschaubild-Kacheln, ein leerer Fortschrittsbalken, eine wirkungslose Schaltfläche „Abbrechen" und in der Mitte der Wartecursor des Betriebssystems.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .titel { font-size: 21px; fill: #5a6472; text-anchor: middle; }
    .btn { font-size: 20px; fill: #9aa3ad; text-anchor: middle; }
  </style>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Fensterrahmen -->
  <rect x="120" y="36" width="960" height="560" rx="10" fill="#ffffff" stroke="#b7bec7" stroke-width="2"/>
  <!-- Titelzeile -->
  <rect x="122" y="38" width="956" height="44" rx="8" fill="#eceff2"/>
  <circle cx="150" cy="60" r="7" fill="#cdd3da"/>
  <circle cx="172" cy="60" r="7" fill="#cdd3da"/>
  <circle cx="194" cy="60" r="7" fill="#cdd3da"/>
  <text class="titel" x="600" y="67">Galerie (Keine Rückmeldung)</text>

  <!-- Vorschaubild-Raster, ausgegraut -->
  <g fill="#d9dee3">
    <rect x="186" y="110" width="108" height="74" rx="4"/><rect x="306" y="110" width="108" height="74" rx="4"/><rect x="426" y="110" width="108" height="74" rx="4"/><rect x="546" y="110" width="108" height="74" rx="4"/><rect x="666" y="110" width="108" height="74" rx="4"/><rect x="786" y="110" width="108" height="74" rx="4"/><rect x="906" y="110" width="108" height="74" rx="4"/>
    <rect x="186" y="196" width="108" height="74" rx="4"/><rect x="306" y="196" width="108" height="74" rx="4"/><rect x="426" y="196" width="108" height="74" rx="4"/><rect x="546" y="196" width="108" height="74" rx="4"/><rect x="666" y="196" width="108" height="74" rx="4"/><rect x="786" y="196" width="108" height="74" rx="4"/><rect x="906" y="196" width="108" height="74" rx="4"/>
    <rect x="186" y="282" width="108" height="74" rx="4"/><rect x="306" y="282" width="108" height="74" rx="4"/><rect x="426" y="282" width="108" height="74" rx="4"/><rect x="546" y="282" width="108" height="74" rx="4"/><rect x="666" y="282" width="108" height="74" rx="4"/><rect x="786" y="282" width="108" height="74" rx="4"/><rect x="906" y="282" width="108" height="74" rx="4"/>
    <rect x="186" y="368" width="108" height="74" rx="4"/><rect x="306" y="368" width="108" height="74" rx="4"/><rect x="426" y="368" width="108" height="74" rx="4"/><rect x="546" y="368" width="108" height="74" rx="4"/><rect x="666" y="368" width="108" height="74" rx="4"/><rect x="786" y="368" width="108" height="74" rx="4"/><rect x="906" y="368" width="108" height="74" rx="4"/>
  </g>

  <!-- Fortschrittsbalken, leer -->
  <rect x="186" y="486" width="520" height="18" rx="9" fill="#ffffff" stroke="#b7bec7" stroke-width="2"/>

  <!-- Schaltfläche „Abbrechen", ohne Wirkung -->
  <rect x="880" y="472" width="134" height="42" rx="8" fill="#eef0f3" stroke="#c3c9d0" stroke-width="2"/>
  <text class="btn" x="947" y="499">Abbrechen</text>

  <!-- Grauschleier: das Betriebssystem hat die App für tot erklärt -->
  <rect x="122" y="84" width="956" height="510" fill="#ffffff" opacity="0.5"/>

  <!-- Wartecursor -->
  <g transform="translate(600 300)">
    <circle r="34" fill="#ffffff" stroke="#5a6472" stroke-width="3"/>
    <g stroke="#5a6472" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-13" opacity="1"/>
      <line x1="17" y1="-17" x2="9" y2="-9" opacity="0.85"/>
      <line x1="24" y1="0" x2="13" y2="0" opacity="0.7"/>
      <line x1="17" y1="17" x2="9" y2="9" opacity="0.55"/>
      <line x1="0" y1="24" x2="0" y2="13" opacity="0.4"/>
      <line x1="-17" y1="17" x2="-9" y2="9" opacity="0.3"/>
      <line x1="-24" y1="0" x2="-13" y2="0" opacity="0.2"/>
      <line x1="-17" y1="-17" x2="-9" y2="-9" opacity="0.12"/>
    </g>
  </g>
</svg>
