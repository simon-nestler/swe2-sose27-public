<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Zeitdiagramm mit zwei Threads: der JavaFX Application Thread mit kurzen Handlern und Pulses, darunter Thread-0 mit dem 40-Sekunden-Balken; Pfeile von unten nach oben melden Fortschritt und Fertig</title>
  <desc id="d">Zwei Zeilen über einer Zeitachse von 0 bis 40 Sekunden. Oben der JavaFX Application Thread mit vielen kurzen Balken – Handler und Pulses, die Oberfläche lebt. Unten Thread-0 mit dem durchgehenden Balken „call(): Export – 40 Sekunden". Gelbe Pfeile führen von unten nach oben: dreimal Fortschritt, am Ende Fertig. Der Hintergrund meldet, das Framework reicht weiter.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .lane { font-size: 24px; font-weight: 700; }
    .balken { font-size: 23px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .anno { font-size: 19px; fill: #5a6472; }
    .pf { font-size: 19px; fill: #5a6472; text-anchor: middle; }
    .achse { font-size: 19px; fill: #5a6472; text-anchor: middle; }
  </style>
  <defs>
    <marker id="pfeil3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8951a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Event-Thread: kurze Handler und Pulses -->
  <text class="lane" x="140" y="118">JavaFX Application Thread</text>
  <text class="anno" x="1049" y="118" text-anchor="end">kurze Handler und Pulses – die Oberfläche lebt</text>
  <g fill="#1a2f6e">
    <rect x="140" y="136" width="18" height="44"/>
    <rect x="216" y="136" width="12" height="44"/>
    <rect x="298" y="136" width="14" height="44"/>
    <rect x="381" y="136" width="12" height="44"/>
    <rect x="470" y="136" width="16" height="44"/>
    <rect x="560" y="136" width="12" height="44"/>
    <rect x="648" y="136" width="14" height="44"/>
    <rect x="737" y="136" width="12" height="44"/>
    <rect x="835" y="136" width="14" height="44"/>
    <rect x="928" y="136" width="12" height="44"/>
    <rect x="1049" y="136" width="24" height="44"/>
  </g>
  <text class="pf" x="1061" y="212">setOnSucceeded</text>

  <!-- Meldungen nach oben -->
  <g fill="none" stroke="#fcd430" stroke-width="5" marker-end="url(#pfeil3)">
    <line x1="367" y1="342" x2="367" y2="196"/>
    <line x1="594" y1="342" x2="594" y2="196"/>
    <line x1="821" y1="342" x2="821" y2="196"/>
    <line x1="1049" y1="342" x2="1049" y2="196"/>
  </g>
  <text class="pf" x="367" y="266">Fortschritt</text>
  <text class="pf" x="594" y="266">Fortschritt</text>
  <text class="pf" x="821" y="266">Fortschritt</text>
  <text class="pf" x="1049" y="266">Fertig</text>

  <!-- Thread-0 -->
  <text class="lane" x="140" y="330">Thread-0</text>
  <rect x="140" y="348" width="909" height="64" fill="#1a2f6e"/>
  <text class="balken" x="594" y="388">call(): Export – 40 Sekunden</text>
  <text class="anno" x="140" y="444">der Hintergrund meldet – das Framework reicht weiter</text>

  <!-- Zeitachse -->
  <line x1="140" y1="490" x2="1140" y2="490" stroke="#c7cdd4" stroke-width="2"/>
  <g stroke="#c7cdd4" stroke-width="2">
    <line x1="140" y1="484" x2="140" y2="496"/>
    <line x1="367" y1="484" x2="367" y2="496"/>
    <line x1="594" y1="484" x2="594" y2="496"/>
    <line x1="821" y1="484" x2="821" y2="496"/>
    <line x1="1049" y1="484" x2="1049" y2="496"/>
  </g>
  <text class="achse" x="140" y="522">0 s</text>
  <text class="achse" x="367" y="522">10 s</text>
  <text class="achse" x="594" y="522">20 s</text>
  <text class="achse" x="821" y="522">30 s</text>
  <text class="achse" x="1049" y="522">40 s</text>
</svg>
