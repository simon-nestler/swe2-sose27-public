<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">Testat-Mechanik im Praktikum: Ausgabe, Bearbeitung, Abgabe, Testat, Selbstbewertung als Kette; die Bearbeitung läuft ohne KI, das Testat ist die Vorführung, die Selbstbewertung schließt jeden Zyklus ab</title>
  <desc id="d">Fünf Kästen in einer Kette von links nach rechts: Ausgabe, Bearbeitung, Abgabe, Testat und Selbstbewertung, verbunden durch Pfeile. Der Kasten Testat ist dunkelblau hervorgehoben, unter dem Kasten Bearbeitung liegt eine gelbe Markierung mit der Beschriftung ohne KI. Darunter eine Zeile mit den Rahmenregeln des Praktikums.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 26px; font-weight: 700; }
    .q { font-size: 18px; fill: #5a6472; }
    .b { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .bw { font-size: 21px; font-weight: 600; text-anchor: middle; fill: #ffffff; }
    .l { font-size: 16px; fill: #5a6472; text-anchor: middle; }
    .lw { font-size: 16px; fill: #dbe4f0; text-anchor: middle; }
    .akzent { font-size: 16px; font-weight: 600; text-anchor: middle; }
    .schritt { fill: #e5effb; }
    .testat { fill: #1a2f6e; }
  </style>
  <defs>
    <marker id="pfeil-tm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1aa"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>

  <text class="h" x="40" y="48">Ein Aufgabenblatt, ein Zyklus – sechsmal im Semester</text>

  <g>
    <rect class="schritt" x="40" y="110" width="190" height="110"/>
    <text class="b" x="135" y="155">Ausgabe</text>
    <text class="l" x="135" y="185">Blatt wird im</text>
    <text class="l" x="135" y="207">Praktikum besprochen</text>

    <rect class="schritt" x="272" y="110" width="190" height="110"/>
    <text class="b" x="367" y="155">Bearbeitung</text>
    <text class="l" x="367" y="185">eigenständig,</text>
    <text class="l" x="367" y="207">ca. 4–6 Stunden</text>

    <rect class="schritt" x="504" y="110" width="190" height="110"/>
    <text class="b" x="599" y="155">Abgabe</text>
    <text class="l" x="599" y="185">via Moodle bzw.</text>
    <text class="l" x="599" y="207">APA-Server</text>

    <rect class="testat" x="736" y="110" width="190" height="110"/>
    <text class="bw" x="831" y="155">Testat</text>
    <text class="lw" x="831" y="185">Vorführung und</text>
    <text class="lw" x="831" y="207">Fragen im Gespräch</text>

    <rect class="schritt" x="968" y="110" width="190" height="110"/>
    <text class="b" x="1063" y="155">Selbstbewertung</text>
    <text class="l" x="1063" y="185">Punkte · Prozent · Note,</text>
    <text class="l" x="1063" y="207">fair und realistisch</text>
  </g>

  <line x1="230" y1="165" x2="268" y2="165" stroke="#9aa1aa" stroke-width="2" marker-end="url(#pfeil-tm)"/>
  <line x1="462" y1="165" x2="500" y2="165" stroke="#9aa1aa" stroke-width="2" marker-end="url(#pfeil-tm)"/>
  <line x1="694" y1="165" x2="732" y2="165" stroke="#9aa1aa" stroke-width="2" marker-end="url(#pfeil-tm)"/>
  <line x1="926" y1="165" x2="964" y2="165" stroke="#9aa1aa" stroke-width="2" marker-end="url(#pfeil-tm)"/>

  <rect x="272" y="228" width="190" height="8" fill="#fcd430"/>
  <text class="akzent" x="367" y="262">ohne KI</text>

  <text class="q" x="40" y="330">Testate alle 1–2 Wochen · 2–3 Vorführungen pro Person · Ihr Werkzeug: Git und die Entwicklungsumgebung</text>
  <text class="q" x="40" y="362">Das Praktikum ist die Zulassungsvoraussetzung zur Klausur – die Selbstbewertung zeigt Ihnen nach jedem Testat, wo Sie stehen.</text>

  <text class="q" x="40" y="430">Die Vorlesung übt nicht, was die Blätter prüfen – sie liefert das Denkzeug, an dem die Blätter scheitern oder gelingen.</text>
</svg>
