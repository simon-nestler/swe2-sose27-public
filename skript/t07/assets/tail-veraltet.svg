<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Der veraltete tail-Zettel: head ist null, Dom hängt nur noch an tail, und sein next zeigt auf Hafen</title>
  <desc id="d">Links ein head-Zettel mit dem Wert null. Rechts ein grau hinterlegter Kasten Dom ohne eingehenden Pfeil außer dem des tail-Zettels darunter. Der next-Zettel von Dom zeigt auf einen Kasten Hafen, dessen next null ist. Von head aus ist nichts davon erreichbar.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .wert { font-size: 28px; font-weight: 700; text-anchor: middle; }
    .wertg { font-size: 28px; font-weight: 700; fill: #5a6472; text-anchor: middle; }
    .feld { font-size: 15px; fill: #5a6472; }
    .zettel { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .nullw { font-size: 22px; font-weight: 700; fill: #5a6472; text-anchor: middle; }
    .lbl { font-size: 18px; fill: #5a6472; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #5a6472; stroke-width: 2; }
    .kopf { fill: #e5effb; stroke: #5a6472; stroke-width: 2; }
    .grau { fill: #eceff2; stroke: #c7cdd4; stroke-width: 2; }
    .pfeil { fill: none; stroke: #3391ff; stroke-width: 3; marker-end: url(#pf7); }
    .grauout { fill: none; stroke: #c7cdd4; stroke-width: 2.5; marker-end: url(#pa7); }
  </style>
  <defs>
    <marker id="pf7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3391ff"/></marker>
    <marker id="pa7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c7cdd4"/></marker>
  </defs>
  <rect width="1200" height="400" fill="#ffffff"/>

  <!-- head-Zettel mit null -->
  <rect class="box" x="60" y="130" width="180" height="60" rx="6"/>
  <text class="zettel" x="115" y="168">head</text>
  <text class="nullw" x="195" y="168">null</text>
  <text class="lbl" x="150" y="230">von hier ist nichts erreichbar</text>

  <!-- Dom, grau, nur über tail erreichbar -->
  <rect class="grau" x="520" y="90" width="180" height="58"/>
  <rect class="grau" x="520" y="148" width="180" height="46"/>
  <text class="wertg" x="610" y="130">Dom</text>
  <text class="feld" x="530" y="164">next</text>
  <path class="grauout" d="M700,171 L858,171"/>

  <!-- Hafen -->
  <rect class="kopf" x="860" y="90" width="180" height="58"/>
  <rect class="box" x="860" y="148" width="180" height="46"/>
  <text class="wert" x="950" y="130">Hafen</text>
  <text class="feld" x="870" y="164">next</text>
  <text class="nullw" x="960" y="180">null</text>

  <!-- tail-Zettel -->
  <rect class="box" x="565" y="290" width="90" height="50" rx="5"/>
  <text class="zettel" x="610" y="322">tail</text>
  <path class="pfeil" d="M610,290 L610,198"/>
</svg>
