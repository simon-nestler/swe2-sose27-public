<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 851" role="img" aria-labelledby="t d">
  <title id="t">Der Semesterplan SWE2: Session 0, 13 Themen mit Teil A und Teil B, drei Anker, sechs Praktikumsblätter ohne KI mit Testat, Klausurzulassung und Klausur</title>
  <desc id="d">Hervorgehoben (gelber Rahmen, Marke HEUTE): Feld 9. Vierzehn Felder in drei Reihen, von links nach rechts zu lesen. Woche 1 ist Session 0, gestrichelt. Dann die Themen: 1 Auftakt, Klassen und Objekte; 2 Kapselung und Invarianten; 3 Vererbung als Vertrag; 4 Polymorphismus und Bindung; 5 Anker 1, Vererbung oder Schnittstelle; 6 Exceptions und Fehlermeldungen; 7 Verkettete Listen, streichbar als zweites; 8 Rekursion und Binärbäume; 9 Collections und Generics, streichbar als erstes; 10 JavaFX und Ereignissteuerung; 11 Event-Thread und Nebenläufigkeit; 12 Anker 2, Audit-Werkstatt; 13 Anker 3, großer Entwurf. Die Anker 5, 12 und 13 sind dunkelblau. Jedes Thema hat Teil A und Teil B à 90 Minuten. Hellblaue Marken unter den Themen zeigen, wann ein Praktikumsblatt kommt: Blatt 1 nach Thema 2, Blatt 2 nach Thema 3, Blatt 3 nach Thema 8, Blatt 4 nach Thema 9, Blatt 5 nach Thema 10, Blatt 6 ab Thema 11 parallel bis Thema 13. Jedes Blatt entsteht ohne KI und endet mit einem Testat. Gelbe Marken: Klausurzulassung über das Praktikum, Klausur mit 120 Minuten ohne Rechner. Ein gestricheltes Feld nach Thema 13: Kommt eine Woche hinzu, wird sie Fragestunde.</desc>
