<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Klassendiagramm: Control, darunter Button, darunter IconButton – render() ist auf allen drei Ebenen definiert</title>
  <desc id="d">Drei Klassenkästen übereinander. Control oben mit render(). Button erbt von Control und überschreibt render(). IconButton erbt von Button, überschreibt render() und ergänzt iconWechseln(). Hohle Dreieckspfeile zeigen von unten nach oben. Die drei render()-Zeilen sind gelb markiert.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .k { font-size: 27px; font-weight: 700; }
    .m { font-size: 23px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .s { font-size: 19px; fill: #5a6472; }
    .box { fill: #ffffff; stroke: #031121; stroke-width: 3; }
    .kopf { fill: #e5effb; stroke: #031121; stroke-width: 3; }
    .erb { stroke: #1a2f6e; stroke-width: 3.5; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Control -->
  <g>
    <rect class="kopf" x="430" y="30" width="340" height="46"/>
    <rect class="box" x="430" y="76" width="340" height="52"/>
    <text class="k" x="600" y="63" text-anchor="middle">Control</text>
    <rect x="448" y="88" width="14" height="14" fill="#fcd430"/>
    <text class="m" x="478" y="103">render()</text>
  </g>

  <!-- Pfeil IconButton/Button-Erbe: Button -> Control -->
  <line class="erb" x1="600" y1="185" x2="600" y2="152"/>
  <path d="M 600 130 L 583 158 L 617 158 Z" fill="#ffffff" stroke="#1a2f6e" stroke-width="3.5"/>

  <!-- Button -->
  <g>
    <rect class="kopf" x="430" y="188" width="340" height="46"/>
    <rect class="box" x="430" y="234" width="340" height="52"/>
    <text class="k" x="600" y="221" text-anchor="middle">Button</text>
    <rect x="448" y="246" width="14" height="14" fill="#fcd430"/>
    <text class="m" x="478" y="261">render()</text>
    <text class="s" x="778" y="261">überschrieben</text>
  </g>

  <!-- Pfeil IconButton -> Button -->
  <line class="erb" x1="600" y1="343" x2="600" y2="310"/>
  <path d="M 600 288 L 583 316 L 617 316 Z" fill="#ffffff" stroke="#1a2f6e" stroke-width="3.5"/>

  <!-- IconButton -->
  <g>
    <rect class="kopf" x="430" y="346" width="340" height="46"/>
    <rect class="box" x="430" y="392" width="340" height="88"/>
    <text class="k" x="600" y="379" text-anchor="middle">IconButton</text>
    <rect x="448" y="404" width="14" height="14" fill="#fcd430"/>
    <text class="m" x="478" y="419">render()</text>
    <text class="s" x="778" y="419">überschrieben</text>
    <text class="m" x="478" y="459">iconWechseln()</text>
    <text class="s" x="778" y="459">nur hier</text>
  </g>

  <text class="s" x="90" y="530">Dieselbe Hierarchie wie in T03 – neu ist nur, was wir hineinlegen: render() dreimal, iconWechseln() einmal.</text>
</svg>
