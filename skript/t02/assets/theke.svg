<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Die Theke: vorne die Karte mit den öffentlichen Methoden, hinten die Küche mit dem privaten Zustand, dazwischen der Tresen</title>
  <desc id="d">Schema einer Theke im Querschnitt. Links der Gastraum mit zwei Gästen und der Karte, auf der drei Einträge stehen: einzahlen, abheben, getSaldo. In der Mitte der Tresen als einzige Übergabe. Rechts die Küche mit Herd, Topf saldo und Vorräten. Ein gestrichelter Pfeil führt vom Gast zum Tresen: die Bestellung. In die Küche führt kein Weg.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 26px; font-weight: 700; }
    .l { font-size: 21px; }
    .s { font-size: 18px; fill: #5a6472; }
    .mono { font-family: "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; font-size: 20px; }
    .box { fill: #ffffff; stroke: #c7cdd4; stroke-width: 2; }
    .zone { fill: #e5effb; stroke: #c7cdd4; stroke-width: 2; }
    .dark { fill: #031121; }
    .gast { fill: #1a2f6e; }
    .path { fill: none; stroke: #3391ff; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3391ff"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Gastraum links -->
  <text class="h" x="60" y="70">Vorne: der Gastraum</text>
  <text class="s" x="60" y="100">was man bestellen kann</text>

  <!-- Die Karte -->
  <rect class="box" x="60" y="130" width="330" height="220" rx="6"/>
  <rect class="dark" x="60" y="130" width="330" height="48" rx="6"/>
  <text class="l" x="84" y="162" style="fill:#ffffff;font-weight:700">Die Karte</text>
  <text class="mono" x="84" y="216">einzahlen(betrag)</text>
  <text class="mono" x="84" y="258">abheben(betrag)</text>
  <text class="mono" x="84" y="300">getSaldo()</text>
  <text class="s" x="84" y="336">öffentliche Methoden</text>

  <!-- Gäste -->
  <g class="gast">
    <circle cx="140" cy="425" r="22"/>
    <rect x="110" y="452" width="60" height="70" rx="18"/>
    <circle cx="250" cy="440" r="22"/>
    <rect x="220" y="467" width="60" height="55" rx="18"/>
  </g>

  <!-- Bestellung -->
  <path class="path" d="M 290 450 C 380 420, 440 400, 505 370"/>
  <text class="l" x="318" y="392">die Bestellung</text>

  <!-- Tresen -->
  <rect class="zone" x="520" y="120" width="90" height="400"/>
  <rect class="dark" x="505" y="330" width="120" height="16" rx="4"/>
  <text class="h" x="565" y="90" text-anchor="middle">der Tresen</text>
  <text class="s" x="565" y="545" text-anchor="middle">die einzige Übergabe</text>

  <!-- Küche rechts -->
  <rect class="zone" x="640" y="130" width="500" height="390" rx="8"/>
  <text class="h" x="670" y="100">Hinten: die Küche</text>

  <!-- Herd -->
  <rect class="dark" x="680" y="380" width="260" height="110" rx="6"/>
  <circle cx="740" cy="410" r="18" fill="none" stroke="#5a6472" stroke-width="4"/>
  <circle cx="810" cy="410" r="18" fill="none" stroke="#5a6472" stroke-width="4"/>
  <circle cx="880" cy="410" r="18" fill="none" stroke="#5a6472" stroke-width="4"/>
  <text class="l" x="700" y="470" style="fill:#ffffff">der Herd</text>

  <!-- Topf saldo -->
  <rect class="box" x="770" y="330" width="120" height="50" rx="4"/>
  <text class="mono" x="790" y="363">saldo</text>

  <!-- Vorräte -->
  <rect class="box" x="700" y="180" width="380" height="110" rx="6"/>
  <text class="l" x="724" y="220">Töpfe, Vorräte, Rezepte</text>
  <text class="s" x="724" y="256">Felder und Abläufe – privater Zustand</text>

  <text class="s" x="670" y="545">niemand bestellt direkt am Herd</text>
</svg>
