<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Drei Schichten: Oberfläche zeigt, Handler vermittelt, Logik entscheidet – Pfeile nur zwischen Nachbarn</title>
  <defs>
    <marker id="ds-pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- Oberfläche -->
  <rect x="150" y="40" width="700" height="140" rx="12" fill="#F5F3EE" stroke="#C7CDD4" stroke-width="2"/>
  <text x="190" y="90" font-size="26" font-weight="700" fill="#031121">Oberfläche</text>
  <text x="190" y="122" font-size="19" fill="#5A6472">zeigt</text>
  <rect x="480" y="72" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="540" y="99" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Button</text>
  <rect x="616" y="72" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="671" y="99" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Label</text>
  <rect x="480" y="124" width="150" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="555" y="151" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">ListView</text>

  <!-- Pfeile Oberfläche <-> Handler -->
  <line x1="420" y1="184" x2="420" y2="226" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ds-pfeil)"/>
  <line x1="580" y1="226" x2="580" y2="184" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ds-pfeil)"/>

  <!-- Handler -->
  <rect x="150" y="230" width="700" height="140" rx="12" fill="#E5EFFB" stroke="#031121" stroke-width="2"/>
  <rect x="150" y="230" width="10" height="140" rx="5" fill="#FCD430"/>
  <text x="190" y="280" font-size="26" font-weight="700" fill="#031121">Handler</text>
  <text x="190" y="312" font-size="19" fill="#5A6472">vermittelt</text>
  <rect x="480" y="272" width="246" height="52" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="603" y="305" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">setOnAction(e -&gt; …)</text>

  <!-- Pfeile Handler <-> Logik -->
  <line x1="420" y1="374" x2="420" y2="416" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ds-pfeil)"/>
  <line x1="580" y1="416" x2="580" y2="374" stroke="#5A6472" stroke-width="2.5" marker-end="url(#ds-pfeil)"/>

  <!-- Logik -->
  <rect x="150" y="420" width="700" height="140" rx="12" fill="#F5F3EE" stroke="#C7CDD4" stroke-width="2"/>
  <text x="190" y="470" font-size="26" font-weight="700" fill="#031121">Logik</text>
  <text x="190" y="502" font-size="19" fill="#5A6472">entscheidet</text>
  <rect x="480" y="452" width="130" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="545" y="479" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Galerie</text>
  <rect x="626" y="452" width="120" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="686" y="479" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Medium</text>
  <rect x="480" y="504" width="266" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="613" y="531" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Foto · Video</text>

  <text x="500" y="590" text-anchor="middle" font-size="18" fill="#5A6472">Pfeile nur zwischen Nachbarn – die Oberfläche kennt die Logik nicht</text>
</svg>
