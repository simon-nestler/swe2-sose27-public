<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Die Theke in drei Zonen: Gastraum (Oberfläche), Kellner (Handler), Küche (Logik) – Pfeile nur zwischen Nachbarn, keine direkte Verbindung Gastraum–Küche</title>
  <defs>
    <marker id="tz-pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6472"/>
    </marker>
  </defs>

  <!-- Gastraum -->
  <rect x="50" y="70" width="300" height="290" rx="12" fill="#F5F3EE" stroke="#C7CDD4" stroke-width="2"/>
  <text x="200" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#031121">Gastraum</text>
  <text x="200" y="140" text-anchor="middle" font-size="17" fill="#5A6472">Oberfläche · zeigt</text>
  <rect x="85" y="168" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="200" y="195" text-anchor="middle" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Button</text>
  <rect x="85" y="222" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="200" y="249" text-anchor="middle" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Label</text>
  <rect x="85" y="276" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="200" y="303" text-anchor="middle" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">ListView</text>

  <!-- Kellner -->
  <rect x="465" y="70" width="270" height="290" rx="12" fill="#E5EFFB" stroke="#031121" stroke-width="2"/>
  <rect x="465" y="70" width="270" height="10" rx="5" fill="#FCD430"/>
  <text x="600" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#031121">Kellner</text>
  <text x="600" y="146" text-anchor="middle" font-size="17" fill="#5A6472">Handler · vermittelt</text>
  <rect x="495" y="190" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="600" y="222" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">setOnAction(</text>
  <rect x="495" y="252" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="600" y="284" text-anchor="middle" font-size="17" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">e -&gt; { … })</text>

  <!-- Küche -->
  <rect x="850" y="70" width="300" height="290" rx="12" fill="#F5F3EE" stroke="#C7CDD4" stroke-width="2"/>
  <text x="1000" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#031121">Küche</text>
  <text x="1000" y="140" text-anchor="middle" font-size="17" fill="#5A6472">Logik · entscheidet</text>
  <rect x="885" y="168" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="1000" y="195" text-anchor="middle" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Galerie</text>
  <rect x="885" y="222" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="1000" y="249" text-anchor="middle" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Foto</text>
  <rect x="885" y="276" width="230" height="42" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="1.5"/>
  <text x="1000" y="303" text-anchor="middle" font-size="18" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#031121">Video</text>

  <!-- Pfeile nur zwischen Nachbarn -->
  <line x1="352" y1="180" x2="461" y2="180" stroke="#5A6472" stroke-width="2.5" marker-end="url(#tz-pfeil)"/>
  <text x="406" y="168" text-anchor="middle" font-size="15" fill="#5A6472">Bestellung</text>
  <line x1="463" y1="250" x2="354" y2="250" stroke="#5A6472" stroke-width="2.5" marker-end="url(#tz-pfeil)"/>
  <text x="406" y="276" text-anchor="middle" font-size="15" fill="#5A6472">Ergebnis</text>

  <line x1="737" y1="180" x2="846" y2="180" stroke="#5A6472" stroke-width="2.5" marker-end="url(#tz-pfeil)"/>
  <text x="792" y="168" text-anchor="middle" font-size="15" fill="#5A6472">trägt hinein</text>
  <line x1="848" y1="250" x2="739" y2="250" stroke="#5A6472" stroke-width="2.5" marker-end="url(#tz-pfeil)"/>
  <text x="792" y="276" text-anchor="middle" font-size="15" fill="#5A6472">bringt zurück</text>

  <!-- Keine direkte Verbindung -->
  <path d="M 200 362 C 200 460, 1000 460, 1000 362" fill="none" stroke="#C7CDD4" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="580" y1="415" x2="620" y2="451" stroke="#5A6472" stroke-width="3"/>
  <line x1="620" y1="415" x2="580" y2="451" stroke="#5A6472" stroke-width="3"/>
  <text x="600" y="496" text-anchor="middle" font-size="17" fill="#5A6472">keine direkte Verbindung Gastraum – Küche</text>
</svg>