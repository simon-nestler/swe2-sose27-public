<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Die Galerie-App als Schema: oben Titel und Suchfeld, Mitte Liste, unten drei Knöpfe, Fußzeile „bereit"</title>

  <!-- Fensterrahmen -->
  <rect x="40" y="30" width="820" height="580" rx="14" fill="#FFFFFF" stroke="#031121" stroke-width="2.5"/>
  <rect x="40" y="30" width="820" height="52" rx="14" fill="#F3F3F3" stroke="#031121" stroke-width="2.5"/>
  <line x1="40" y1="82" x2="860" y2="82" stroke="#031121" stroke-width="2"/>
  <circle cx="76" cy="56" r="8" fill="#C7CDD4"/>
  <circle cx="104" cy="56" r="8" fill="#C7CDD4"/>
  <circle cx="132" cy="56" r="8" fill="#C7CDD4"/>
  <text x="450" y="63" text-anchor="middle" font-size="19" fill="#5A6472">GalerieApp</text>

  <!-- Kopf: Titel und Suchfeld -->
  <text x="80" y="136" font-size="26" font-weight="700" fill="#031121">Galerie</text>
  <rect x="420" y="106" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="440" y="134" font-size="18" fill="#9AA1AA">Suchbegriff …</text>

  <!-- Liste -->
  <rect x="80" y="176" width="740" height="264" rx="8" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <rect x="82" y="178" width="736" height="62" fill="#E5EFFB"/>
  <text x="104" y="216" font-size="19" fill="#031121">Strand · Foto · 2400 KB</text>
  <line x1="82" y1="242" x2="818" y2="242" stroke="#F3F3F3" stroke-width="2"/>
  <text x="104" y="282" font-size="19" fill="#031121">Berg · Foto · 1800 KB</text>
  <line x1="82" y1="308" x2="818" y2="308" stroke="#F3F3F3" stroke-width="2"/>
  <text x="104" y="348" font-size="19" fill="#031121">Sommer · Video · 12:40 min</text>
  <line x1="82" y1="374" x2="818" y2="374" stroke="#F3F3F3" stroke-width="2"/>

  <!-- Knopfleiste -->
  <rect x="80" y="470" width="200" height="52" rx="10" fill="#E5EFFB" stroke="#031121" stroke-width="2"/>
  <text x="180" y="503" text-anchor="middle" font-size="19" fill="#031121">Hinzufügen</text>
  <rect x="300" y="470" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="400" y="503" text-anchor="middle" font-size="19" fill="#031121">Löschen</text>
  <rect x="520" y="470" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2"/>
  <text x="620" y="503" text-anchor="middle" font-size="19" fill="#031121">Exportieren</text>

  <!-- Fußzeile -->
  <line x1="40" y1="556" x2="860" y2="556" stroke="#C7CDD4" stroke-width="2"/>
  <text x="80" y="590" font-size="18" fill="#5A6472">bereit</text>
</svg>
