<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
  <title id="t">Schema der Entwurfsakte: Klassendiagramm mit offener vierter Klasse, Behältertabelle, Event-Tabelle und die Liste der strittigen Stellen</title>
  <desc id="d">Ein Whiteboard mit vier Bereichen. Links das Modell: drei Klassenkästen mit je drei Attributzeilen, dazu ein gestrichelter vierter Kasten mit Fragezeichen; jede Beziehung trägt die Frage nach dem Kriterium. Rechts oben die Behältertabelle mit den Spalten Sammlung, Leitfrage, Behälter und Begründung. Rechts darunter die Event-Tabelle mit den Spalten Mensch tut, Oberfläche zeigt, Modellmethode und dünn oder Modell. Unten die Liste der strittigen Stellen mit gelbem Marker – das Angriffsziel für Teil B.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .kopf { font-size: 26px; font-weight: 700; }
    .kopf2 { font-size: 18px; fill: #5a6472; }
    .p { font-size: 22px; font-weight: 700; fill: #1a2f6e; }
    .kl { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .kl4 { font-size: 18px; font-weight: 700; fill: #8a5f00; }
    .attr { font-size: 15px; fill: #5a6472; }
    .krit { font-size: 15px; fill: #5a6472; }
    .tabh { font-size: 16px; font-weight: 700; }
    .tabz { font-size: 16px; fill: #5a6472; }
    .strit { font-size: 18px; fill: #031121; }
    .box { fill: #ffffff; stroke: #c7cdd4; stroke-width: 2; }
    .kbal { fill: #1a2f6e; }
    .grid { stroke: #e3e6ea; stroke-width: 1; }
    .rel { stroke: #031121; stroke-width: 2; }
    .rel4 { stroke: #8a5f00; stroke-width: 2; stroke-dasharray: 7 5; }
  </style>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="20" y="20" width="1240" height="680" rx="8" fill="#ffffff" stroke="#c7cdd4" stroke-width="3"/>

  <text class="kopf" x="50" y="72">Entwurfsakte · [FALL: Name der App]</text>
  <text class="kopf2" x="900" y="72">Whiteboard-Foto → Moodle, heute noch</text>

  <!-- Bereich 1: Modell -->
  <text class="p" x="50" y="128">1 · Modell</text>
  <!-- Klasse A -->
  <rect class="box" x="60" y="150" width="190" height="110"/>
  <rect class="kbal" x="60" y="150" width="190" height="34"/>
  <text class="kl" x="76" y="174">Klasse A</text>
  <text class="attr" x="76" y="208">– Attribut 1</text>
  <text class="attr" x="76" y="230">– Attribut 2</text>
  <text class="attr" x="76" y="252">– Attribut 3</text>
  <!-- Klasse B -->
  <rect class="box" x="380" y="150" width="190" height="110"/>
  <rect class="kbal" x="380" y="150" width="190" height="34"/>
  <text class="kl" x="396" y="174">Klasse B</text>
  <text class="attr" x="396" y="208">– Attribut 1</text>
  <text class="attr" x="396" y="230">– Attribut 2</text>
  <text class="attr" x="396" y="252">– Attribut 3</text>
  <!-- Klasse C -->
  <rect class="box" x="60" y="330" width="190" height="110"/>
  <rect class="kbal" x="60" y="330" width="190" height="34"/>
  <text class="kl" x="76" y="354">Klasse C</text>
  <text class="attr" x="76" y="388">– Attribut 1</text>
  <text class="attr" x="76" y="410">– Attribut 2</text>
  <text class="attr" x="76" y="432">– Attribut 3</text>
  <!-- Vierte Klasse, offen -->
  <rect x="380" y="330" width="190" height="110" fill="#fff8dd" stroke="#8a5f00" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="kl4" x="396" y="358">4. Klasse?</text>
  <text class="attr" x="396" y="390">fehlt noch –</text>
  <text class="attr" x="396" y="412">trägt sie die Beziehung?</text>
  <!-- Beziehungen -->
  <line class="rel" x1="250" y1="205" x2="380" y2="205"/>
  <text class="krit" x="272" y="196">Kriterium?</text>
  <line class="rel" x1="155" y1="260" x2="155" y2="330"/>
  <text class="krit" x="168" y="300">Kriterium?</text>
  <line class="rel4" x1="475" y1="260" x2="475" y2="330"/>
  <text class="krit" x="488" y="300">Kriterium?</text>

  <!-- Bereich 2: Behälter -->
  <text class="p" x="640" y="128">2 · Behälter</text>
  <rect class="box" x="640" y="150" width="590" height="140"/>
  <line class="grid" x1="640" y1="186" x2="1230" y2="186"/>
  <line class="grid" x1="640" y1="238" x2="1230" y2="238"/>
  <line class="grid" x1="790" y1="150" x2="790" y2="290"/>
  <line class="grid" x1="940" y1="150" x2="940" y2="290"/>
  <line class="grid" x1="1070" y1="150" x2="1070" y2="290"/>
  <text class="tabh" x="654" y="174">Sammlung</text>
  <text class="tabh" x="804" y="174">Leitfrage</text>
  <text class="tabh" x="954" y="174">Behälter</text>
  <text class="tabh" x="1084" y="174">Begründung</text>
  <text class="tabz" x="654" y="218">…</text><text class="tabz" x="804" y="218">…</text><text class="tabz" x="954" y="218">…</text><text class="tabz" x="1084" y="218">ein Satz</text>
  <text class="tabz" x="654" y="270">…</text><text class="tabz" x="804" y="270">…</text><text class="tabz" x="954" y="270">…</text><text class="tabz" x="1084" y="270">ein Satz</text>

  <!-- Bereich 3: Ereignisse -->
  <text class="p" x="640" y="336">3 · Ereignisse</text>
  <rect class="box" x="640" y="358" width="590" height="140"/>
  <line class="grid" x1="640" y1="394" x2="1230" y2="394"/>
  <line class="grid" x1="640" y1="446" x2="1230" y2="446"/>
  <line class="grid" x1="790" y1="358" x2="790" y2="498"/>
  <line class="grid" x1="970" y1="358" x2="970" y2="498"/>
  <line class="grid" x1="1120" y1="358" x2="1120" y2="498"/>
  <text class="tabh" x="654" y="382">Mensch tut</text>
  <text class="tabh" x="804" y="382">Oberfläche zeigt</text>
  <text class="tabh" x="984" y="382">Modellmethode</text>
  <text class="tabh" x="1134" y="382">dünn?</text>
  <text class="tabz" x="654" y="426">…</text><text class="tabz" x="804" y="426">…</text><text class="tabz" x="984" y="426">…</text><text class="tabz" x="1134" y="426">…</text>
  <text class="tabz" x="654" y="478">…</text><text class="tabz" x="804" y="478">…</text><text class="tabz" x="984" y="478">…</text><text class="tabz" x="1134" y="478">…</text>

  <!-- Bereich 4: Strittige Stellen -->
  <text class="p" x="50" y="546">4 · Strittige Stellen</text>
  <rect class="box" x="50" y="568" width="1180" height="112"/>
  <rect x="50" y="568" width="10" height="112" fill="#fcd430"/>
  <text class="strit" x="84" y="604">– [FALL: Sammlung oder Beziehung ohne Einigung] – notiert, nicht entschieden</text>
  <text class="strit" x="84" y="634">– [FALL: zweiter strittiger Punkt]</text>
  <text class="krit" x="84" y="664">Beweismaterial für Teil B: Genau hier setzen die Angriffe an.</text>
</svg>
