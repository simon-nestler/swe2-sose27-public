<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Schätzung des Raums gegen die METR-Messung: Abstimmungsverteilung als Platzhalter, gemessen 19 Prozent langsamer, gefühlt 20 Prozent schneller</title>
  <desc id="d">Zwei Felder. Links vier gestrichelte Platzhalterbalken für die Moodle-Abstimmung über die Antworten etwa 40 Prozent schneller, etwa 20 Prozent schneller, gleich schnell und langsamer. Rechts eine Nulllinie mit zwei Balken: gemessen 19 Prozent langsamer in Blau, gefühlt 20 Prozent schneller in Gelb.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 26px; font-weight: 700; }
    .q { font-size: 18px; fill: #5a6472; }
    .x { font-size: 19px; fill: #5a6472; text-anchor: middle; }
    .v { font-size: 22px; font-weight: 700; text-anchor: middle; fill: #5a6472; }
    .b { font-size: 22px; font-weight: 700; }
    .grid { stroke: #c7cdd4; stroke-width: 1; }
    .ph { fill: none; stroke: #5a6472; stroke-width: 2; stroke-dasharray: 6 6; }
    .bar-blau { fill: #1a2f6e; }
    .bar-gelb { fill: #fcd430; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Panel links: die Schätzung des Raums, Platzhalter bis zur Abstimmung -->
  <text class="h" x="40" y="48">Ihre Schätzung</text>
  <text class="q" x="40" y="78">Verteilung entsteht live aus der Moodle-Abstimmung</text>
  <line class="grid" x1="40" y1="440" x2="560" y2="440"/>
  <g>
    <rect class="ph" x="60"  y="220" width="80" height="220"/><text class="v" x="100" y="205">?</text>
    <rect class="ph" x="190" y="180" width="80" height="260"/><text class="v" x="230" y="165">?</text>
    <rect class="ph" x="320" y="330" width="80" height="110"/><text class="v" x="360" y="315">?</text>
    <rect class="ph" x="450" y="390" width="80" height="50"/><text class="v" x="490" y="375">?</text>
    <text class="x" x="100" y="472">etwa 40 %</text><text class="x" x="100" y="496">schneller</text>
    <text class="x" x="230" y="472">etwa 20 %</text><text class="x" x="230" y="496">schneller</text>
    <text class="x" x="360" y="472">gleich</text><text class="x" x="360" y="496">schnell</text>
    <text class="x" x="490" y="472">langsamer</text>
  </g>

  <!-- Panel rechts: die Messung -->
  <text class="h" x="640" y="48">Die Messung – METR 2025</text>
  <text class="q" x="640" y="78">dieselben Personen, dieselben Aufgaben</text>
  <!-- Nulllinie -->
  <line class="grid" x1="900" y1="110" x2="900" y2="440"/>
  <text class="x" x="900" y="472">0 %</text>
  <text class="q" x="660" y="472">langsamer</text>
  <text class="q" x="1074" y="472" text-anchor="end">schneller</text>
  <!-- gemessen: 19 % langsamer (4,8 px je Prozentpunkt) -->
  <rect class="bar-blau" x="808.8" y="170" width="91.2" height="80"/>
  <text class="b" x="660" y="150">gemessen: 19 % langsamer</text>
  <!-- gefühlt: 20 % schneller -->
  <rect class="bar-gelb" x="900" y="330" width="96" height="80"/>
  <text class="b" x="660" y="310">gefühlt: 20 % schneller</text>
</svg>
