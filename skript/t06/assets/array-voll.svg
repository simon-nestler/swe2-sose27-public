<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-labelledby="t d">
  <title id="t">Ein Galerie-Array mit 100 Kästchen, alle belegt – Bild Nummer 101 steht daneben</title>
  <desc id="d">Links ein Raster aus 10 mal 10 Kästchen, alle gefüllt, beschriftet mit bilder, 100 Plätze, alle belegt. Rechts daneben steht ein einzelnes, gelb gerahmtes Kästchen mit der Nummer 101 und der Frage wohin damit.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 24px; font-weight: 700; }
    .m { font-size: 21px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .s { font-size: 19px; fill: #5a6472; }
    .num { font-size: 30px; font-weight: 700; text-anchor: middle; }
    .grid { stroke: #c7cdd4; stroke-width: 2; }
  </style>
  <rect width="1240" height="560" fill="#ffffff"/>

  <text class="m" x="120" y="70">Bild[] bilder = new Bild[100];</text>
  <text class="s" x="120" y="102">100 Plätze – alle belegt</text>

  <!-- Raster 10 x 10, gefüllt -->
  <rect x="120" y="130" width="380" height="380" fill="#e5effb" stroke="#031121" stroke-width="3"/>
  <g class="grid">
    <line x1="158" y1="130" x2="158" y2="510"/><line x1="196" y1="130" x2="196" y2="510"/>
    <line x1="234" y1="130" x2="234" y2="510"/><line x1="272" y1="130" x2="272" y2="510"/>
    <line x1="310" y1="130" x2="310" y2="510"/><line x1="348" y1="130" x2="348" y2="510"/>
    <line x1="386" y1="130" x2="386" y2="510"/><line x1="424" y1="130" x2="424" y2="510"/>
    <line x1="462" y1="130" x2="462" y2="510"/>
    <line x1="120" y1="168" x2="500" y2="168"/><line x1="120" y1="206" x2="500" y2="206"/>
    <line x1="120" y1="244" x2="500" y2="244"/><line x1="120" y1="282" x2="500" y2="282"/>
    <line x1="120" y1="320" x2="500" y2="320"/><line x1="120" y1="358" x2="500" y2="358"/>
    <line x1="120" y1="396" x2="500" y2="396"/><line x1="120" y1="434" x2="500" y2="434"/>
    <line x1="120" y1="472" x2="500" y2="472"/>
  </g>
  <text class="s" x="120" y="544">bilder[0] bis bilder[99]</text>

  <!-- Bild 101 -->
  <rect x="720" y="270" width="110" height="110" fill="#ffffff" stroke="#fcd430" stroke-width="8"/>
  <text class="num" x="775" y="336">101</text>
  <text class="h" x="700" y="238">Bild Nummer 101</text>
  <text class="s" x="700" y="418">wohin damit?</text>
</svg>
